<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Битва с мошенником</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section id="screen-start" class="screen container py-5 text-center">
  <div class="case-badge mb-3">ДЕЛО №1</div>
  <h1 class="display-5 fw-bold">Битва с мошенником</h1>
  <p class="lead text-secondary mt-3">Тебе пишут семеро. Шестеро хотят твои деньги.<br>Раскуси их — и не попадись.</p>
  <button class="btn btn-warning btn-lg px-5 mt-3" onclick="startGame()">Открыть мессенджер</button>
</section>

<section id="screen-list" class="screen d-none">
  <div class="chat-app">
    <header class="chat-header">
      <div class="chat-title"><div>Сообщения</div></div>
      <div class="chat-hud">
        <span class="hud-item">💰 <span id="hud-money">10000</span>₽</span>
        <span class="hud-item">🎯 <span id="hud-caught">0</span>/6 <span class="hud-note">мошенников</span></span>
      </div>
    </header>
    <div class="chat-list" id="chat-list"></div>
  </div>
</section>

<section id="screen-chat" class="screen d-none">
  <div class="chat-app">
    <header class="chat-header">
      <button class="back-btn" onclick="backToList()">←</button>
      <div class="chat-avatar" id="chat-avatar">?</div>
      <div class="chat-title">
        <div id="chat-name">…</div>
        <div class="chat-status" id="chat-status">онлайн</div>
      </div>
      <div class="chat-hud">
        <span class="hud-item">💰 <span id="hud-money2">10000</span>₽</span>
      </div>
    </header>
    <div class="chat-messages" id="chat-messages"></div>
    <div id="chat-finished-banner" class="finished-banner d-none">
      🔒 Чат завершён. Историю можно посмотреть, но переиграть нельзя.
    </div>
    <div class="chat-actions" id="chat-actions"></div>
  </div>
</section>

<section id="screen-result" class="screen container py-5 d-none text-center">
  <div class="case-badge mb-3">ВЕРДИКТ</div>
  <h2 id="rank" class="display-6 fw-bold"></h2>
  <p id="advice" class="lead text-secondary my-3"></p>
  <p class="mb-4">Поймано мошенников: <span id="final-caught" class="fw-bold"></span></p>
  <div class="d-grid gap-2 mx-auto" style="max-width:320px">
    <button class="btn btn-warning btn-lg" onclick="shareResult()">Поделиться результатом</button>
    <button class="btn btn-outline-light" onclick="restart()">Пройти заново</button>
  </div>
</section>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
